name: AURA one-time Workflow materialization

on:
  push:
    branches:
      - refactor/aura-playbook-workflow-skill-1
    paths:
      - scripts/materialize_workflow_architecture.py
      - .github/workflows/aura-materialize-workflows.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/aura-playbook-workflow-skill-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Materialize canonical Workflow architecture
        run: python scripts/materialize_workflow_architecture.py

      - name: Rebuild derived navigation and registries
        run: python scripts/generate_registry.py

      - name: Validate canonical workspace
        run: python scripts/validate_workspace.py

      - name: Run complete product-integrity suite
        run: python tests/run_all.py

      - name: Commit materialized source and remove one-time runner
        run: |
          git config user.name "AURA Refactor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 0
          fi
          git commit -m "Materialize canonical Playbook Workflow architecture"
          git push origin HEAD:refactor/aura-playbook-workflow-skill-1
