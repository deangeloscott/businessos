name: Build and release AURA

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: aura-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  product:
    name: Test and package AURA
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run the release gate and build the plain ZIP
        run: |
          python -m pip install -r requirements.txt
          python -u scripts/package_release.py --output-dir "${{ runner.temp }}/plain"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aura-plain
          path: |
            ${{ runner.temp }}/plain/*.zip
            ${{ runner.temp }}/plain/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check native client portability
        # The full product gate covers Windows. Check the other OSes here.
        if: matrix.target == 'linux-x64' || matrix.target == 'macos-x64'
        run: |
          python -m pip install -r requirements.txt
          python tests/run_workspace_native_sessions.py
          python tests/run_workspace_native_interop.py
          python tests/run_workspace_acp.py
          python tests/run_workspace_hermes.py
      - name: Build and verify the native download
        run: python -u scripts/package_runtime.py --platform "${{ matrix.target }}" --output-dir "${{ runner.temp }}/bundles" --cache-dir "${{ runner.temp }}/runtime-cache"
      - name: Upgrade and roll back a published Windows installation
        if: matrix.target == 'windows-x64'
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python -u tests/smoke_windows_upgrade.py "${{ runner.temp }}/bundles/viraltrac-aura-v$version-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aura-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/bundles/*.zip
            ${{ runner.temp }}/bundles/*.tar.gz
            ${{ runner.temp }}/bundles/*.sha256
            ${{ runner.temp }}/bundles/bundle-report-*.json
          if-no-files-found: error
          retention-days: 7
  assemble:
    name: Verify release assets
    needs: [product, bundle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: aura-*
          path: artifacts
      - run: python .github/scripts/verify_release_assets.py artifacts
  publish:
    name: Publish the verified prerelease
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: aura-*
          path: artifacts
      - run: python .github/scripts/verify_release_assets.py artifacts --publish
        env:
          GH_TOKEN: ${{ github.token }}
