name: One-time AURA alignment migration

on:
  push:
    branches:
      - refactor/aura-organizational-alignment-1

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/aura-organizational-alignment-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply deterministic alignment sweep
        run: python scripts/_aura_alignment_migration.py

      - name: Regenerate registries
        run: python scripts/generate_registry.py

      - name: Validate workspace
        run: python scripts/validate_workspace.py

      - name: Run public regression suite
        run: python tests/run_all.py

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No migration diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply validated AURA control-plane metadata sweep"
          git push origin HEAD:refactor/aura-organizational-alignment-1
